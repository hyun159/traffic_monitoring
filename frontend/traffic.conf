user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;



events {
  worker_connections 1024; # 워커 1개당 최대 동시 연결 1024개
}


http {                         # http 공통 규칙 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;



  # HTTP
  server {                     # 포트/도메인 1
    listen 80;
    server_name yulhatraffic.kro.kr;

    return 301 https://$host$request_uri;   # https로 재요청

  }


  # HTTPS
  server {                     # 포트/도메인 2
    listen 443 ssl;
    server_name yulhatraffic.kro.kr;

    ssl_certificate /etc/letsencrypt/live/yulhatraffic.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yulhatraffic.kro.kr/privkey.pem;


    location / {               # url 경로 1 (정적 HTML)
        root /usr/share/nginx/html;
        index index.html;
    }

    location /cctv/ {           # url 경로 2 (동적 FastApi)
         proxy_pass http://192.168.0.4:80;

         proxy_set_header Host $host;                                       # 사용자가 요청한 도메인 전달
         proxy_set_header X-Real-IP $remote_addr;                           # 실제 클라이언츠 ip 전달
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;       # 프록시를 거쳐간 IP 경로 기록
         proxy_set_header X-Forwarded-Proto $scheme;                        # HTTP와 HTTPS 요청 구분하여 전달

        # 타임아웃
         proxy_connect_timeout 60s;                                         # 백엔드 TCP 연결 성립 대기
         proxy_send_timeout 60s;                                            # 백엔드로 요청 전송 중 60초간 전송 진전이 없으면 timeout
         proxy_read_timeout 60s;                                            # 백엔드 응답을 읽는 중 60초간 데이터가 없으면 timeout
    }


      location /traffic {               # url 경로 3 ( 5분 갱신 API)
        proxy_pass http://192.168.0.4:80;
  
    }
  }
}