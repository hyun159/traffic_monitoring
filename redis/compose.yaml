services:
  redis:
    image: redis:alpine
    container_name: redis
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro # conf파일 바인드
      - ./users.acl:/usr/local/etc/redis/users.acl:ro # acl 파일 바인드
    restart: always

volumes:
  - redis_data: {}